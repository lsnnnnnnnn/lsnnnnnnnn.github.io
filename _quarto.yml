website:
  title: "Sheng’en Li"
  site-url: https://lsnnnnnnnn.github.io
  description: "Sheng’en Li — applied mathematics and reliable machine learning."
  favicon: assets/favicon.svg
  open-graph: true
  search: false
  navbar:
    pinned: true
    background: light
    foreground: "#222222"
    right:
      - text: Home
        href: index.qmd
      - text: Research
        href: projects.qmd
      - text: Publications
        href: publications.qmd
      - text: Notes
        href: blog/index.qmd
      - text: Tools
        href: tools.qmd
  page-footer:
    left: "© 2026 Sheng’en Li"

format:
  html:
    theme: default
    include-in-header:
      text: |
        <link rel="stylesheet" href="/styles.css?v=20261117-tool-cards">
    toc: false
    pagetitle: "{{< meta title >}}"
    anchor-sections: false
    html-math-method: katex
    link-external-newwindow: true
    include-before-body: _includes/skip-link.html
    grid:
      body-width: 820px
      sidebar-width: 0px
      margin-width: 0px



project:
  type: website
  output-dir: docs
  resources:
    - assets/Shengen_Li_CV.pdf
    - assets/research-graph.svg
    - assets/favicon.svg
    - .nojekyll

website:
  title: "Sheng’en Li"
  site-url: https://lsnnnnnnnn.github.io
  description: "Sheng’en Li — applied mathematics, reliable machine learning, counterfactual inference, and scientific model auditing."
  favicon: assets/favicon.svg
  open-graph: true
  navbar:
    pinned: true
    background: light
    foreground: "#252e29"
    right:
      - text: Research
        href: projects.qmd
      - text: Publications
        href: publications.qmd
      - text: About
        href: about.qmd
      - text: Notes
        href: blog/index.qmd
      - text: CV
        href: cv.qmd
  page-footer:
    left: "© 2026 Sheng’en Li"
    right:
      - text: Email
        href: mailto:sl879@duke.edu
      - text: GitHub
        href: https://github.com/lsnnnnnnnn

format:
  html:
    theme: default
    css: styles.css
    toc: false
    pagetitle: "{{< meta title >}}"
    anchor-sections: false
    code-copy: true
    html-math-method: katex
    link-external-newwindow: true
    include-before-body: _includes/skip-link.html
    grid:
      body-width: 1100px
      sidebar-width: 0px
      margin-width: 0px

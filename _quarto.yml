project:
  type: website
  output-dir: docs
  resources:
    - assets/Shengen_Li_CV.pdf
    - assets/profile.jpg
    - assets/favicon.svg
    - .nojekyll

website:
  title: "Sheng’en Li"
  site-url: https://lsnnnnnnnn.github.io
  description: "Sheng’en Li — applied mathematics and reliable machine learning."
  favicon: assets/favicon.svg
  open-graph: true
  search: false
  navbar:
    pinned: true
    background: light
    foreground: "#222222"
    right:
      - text: Home
        href: index.qmd
      - text: Publications
        href: publications.qmd
      - text: Research
        href: projects.qmd
      - text: More
        href: about.qmd
      - text: CV
        href: assets/Shengen_Li_CV.pdf
        target: _blank
  page-footer:
    left: "© 2026 Sheng’en Li"
    right: "Last updated September 2026"

format:
  html:
    theme: default
    css: styles.css
    toc: false
    pagetitle: "{{< meta title >}}"
    anchor-sections: false
    html-math-method: katex
    link-external-newwindow: true
    include-before-body: _includes/skip-link.html
    grid:
      body-width: 850px
      sidebar-width: 0px
      margin-width: 0px

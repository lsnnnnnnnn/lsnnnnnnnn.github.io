project:
  type: website
  output-dir: docs
  resources:
    - assets/Shengen_Li_CV.pdf
    - assets/profile.jpg
    - assets/favicon.svg
    - assets/research/*.webp
    - styles.css
    - .nojekyll

website:
  title: "Sheng’en Li"
  site-url: https://lsnnnnnnnn.github.io
  description: "Sheng’en Li — applied mathematics and reliable machine learning."
  favicon: assets/favicon.svg
  open-graph: true
  search: false
  navbar:
    pinned: true
    background: light
    foreground: "#222222"
    right:
      - text: Home
        href: index.qmd
      - text: Research
        href: projects.qmd
      - text: Publications
        href: publications.qmd
      - text: Notes
        href: blog/index.qmd
      - text: Software
        href: software.qmd
      - text: CV
        href: assets/Shengen_Li_CV.pdf
        target: _blank
  page-footer:
    left: "© 2026 Sheng’en Li"
    right: "[More about me](/about.qmd) · Updated November 2026"

format:
  html:
    theme: default
    include-in-header:
      text: |
        <link rel="stylesheet" href="/styles.css?v=20261111-notes">
    toc: false
    pagetitle: "{{< meta title >}}"
    anchor-sections: false
    html-math-method: katex
    link-external-newwindow: true
    include-before-body: _includes/skip-link.html
    grid:
      body-width: 820px
      sidebar-width: 0px
      margin-width: 0px
